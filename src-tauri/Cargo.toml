[package]
name = "classnest"
version = "0.1.0"
description = "ClassNest — WakeUp 风格课程表桌面应用"
authors = ["ClassNest Contributors"]
edition = "2021"

# 库名（lib.rs 由 main.rs 调用），与前端包名 classnest 区分
[lib]
name = "classnest_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
